name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer_intelligence
          POSTGRES_USER: customer_intelligence
          POSTGRES_PASSWORD: change-me
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize PostgreSQL Schema & Data
        env:
          DATABASE_URL: postgresql://customer_intelligence:change-me@localhost:15432/customer_intelligence
        run: |
          PYTHONPATH=backend python -c "
          import psycopg
          from pathlib import Path
          conn = psycopg.connect('postgresql://customer_intelligence:change-me@localhost:15432/customer_intelligence')
          with conn.cursor() as cur:
              cur.execute(Path('sql/001_schema.sql').read_text(encoding='utf-8'))
          conn.commit()
          conn.close()
          "
          PYTHONPATH=backend python backend/scripts/import_full_dataset.py
          PYTHONPATH=backend python backend/scripts/persist_segments.py
          PYTHONPATH=backend python -c "
          import psycopg
          from pathlib import Path
          conn = psycopg.connect('postgresql://customer_intelligence:change-me@localhost:15432/customer_intelligence')
          with conn.cursor() as cur:
              cur.execute(Path('sql/powerbi_views.sql').read_text(encoding='utf-8'))
          conn.commit()
          conn.close()
          "

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://customer_intelligence:change-me@localhost:15432/customer_intelligence
          PYTHONPATH: backend
        run: |
          pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and Build Frontend
        run: npm run build
